<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
    <linearGradient id="glossStroke" x1="256" y1="108" x2="256" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FC1FF"/>
      <stop offset="45%" stop-color="#2E86FF"/>
      <stop offset="100%" stop-color="#0047B3"/>
    </linearGradient>
    <radialGradient id="eraseGrad" cx="256" cy="100" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505" stop-opacity="1"/>
      <stop offset="45%" stop-color="#050505" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#050505" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>
 
  <!-- Background -->
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="#050505"/>
  </g>
 
  <!-- Stacked layers, recentered -->
  <g transform="translate(0,16)">
  <polyline points="160,312 256,356 352,312"
            fill="none" stroke="#64748B" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>
 
  <polyline points="160,232 256,276 352,232"
            fill="none" stroke="#F0F4F8" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>
 
  <!-- Fixed Blue Top Layer: a "byte" popped off the top of the stack -->
  <polygon points="156,152 221,123 221,139 237,139 237,153 254,153 254,139 271,139 271,125 288,125 288,137 318,137 352,152 256,196"
           fill="url(#glossStroke)" stroke="url(#glossStroke)" stroke-width="20"
           stroke-linejoin="round"/>
  </g>
</svg>